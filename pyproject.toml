[tool.poetry]
name = "resistflow"
version = "0.1.0"
description = "A forward-time simulation framework for exploring insecticide resistance evolution in African malaria vectors"
authors = ["Mohamed Laarej <mohamed.laarej.eng@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "resistflow", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.0"
matplotlib = "^3.8"
pandas = "^2.1"
malariagen-data = {version = ">=7.0", optional = true, python = ">=3.10,<3.13"}
scipy = "^1.11"

[tool.poetry.extras]
malariagen = ["malariagen-data"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
jupyter = "^1.0"
notebook = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"